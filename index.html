  <style>
    :root { --primary: #2d5a3d; --primary-light: #4a7c59; --secondary: #d4a574; --accent: #e8b86d; --bg: #f7f5ee; --card: #ffffff; --text: #2c3e2d; --text-light: #6b7b6e; --border: #e0d5c1; --shadow: 0 4px 16px rgba(45,90,61,0.06); --shadow-hover: 0 8px 24px rgba(45,90,61,0.12); --radius: 16px; --star: #f59e0b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Open Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    h1,h2,h3,h4 { font-family: 'Montserrat', sans-serif; }
    .hero { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; padding: 3rem 1rem 3.5rem; text-align: center; position: relative; overflow: hidden; }

    .hero h1 { font-size: 2.4rem; margin-bottom: 0.4rem; font-weight: 700; text-shadow: 1px 1px 3px rgba(0,0,0,0.15); }
    .hero p { font-size: 1.1rem; opacity: 0.9; }
    .search-wrap { max-width: 700px; margin: -1.8rem auto 1.5rem; padding: 0 1rem; position: relative; z-index: 2; }
    .search-box { background: white; border-radius: 50px; display: flex; align-items: center; box-shadow: var(--shadow-hover); border: 2px solid var(--border); padding: 0.4rem; transition: 0.3s; }
    .search-box:focus-within { border-color: var(--secondary); transform: translateY(-2px); }
    .search-box input { flex: 1; border: none; padding: 0.9rem 1.2rem; font-size: 1rem; outline: none; background: transparent; font-family: inherit; }
    .search-box button { background: var(--secondary); color: white; border: none; padding: 0.8rem 1.8rem; border-radius: 50px; cursor: pointer; font-weight: 600; transition: 0.3s; font-family: 'Montserrat', sans-serif; }
    .search-box button:hover { background: var(--accent); }
    .nav-container { max-width: 1100px; margin: 0 auto; padding: 0 1rem 1rem; }
    .rubric-tabs { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1rem; }
    .tab-btn { padding: 0.6rem 1.2rem; background: white; border: 2px solid var(--border); border-radius: 30px; cursor: pointer; font-weight: 600; transition: 0.3s; font-family: 'Montserrat', sans-serif; font-size: 0.85rem; white-space: nowrap; box-shadow: var(--shadow); }
    .tab-btn:hover, .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-2px); }
    .subcat-pills { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1.5rem; }
    .pill { padding: 0.4rem 0.9rem; background: rgba(255,255,255,0.7); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
    .pill:hover, .pill.active { background: var(--secondary); color: white; border-color: var(--secondary); }
    .stats { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .stat { background: white; padding: 0.8rem 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; }
    .stat-num { font-size: 1.5rem; font-weight: 700; color: var(--primary); font-family: 'Montserrat', sans-serif; }
    .stat-label { font-size: 0.8rem; color: var(--text-light); }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1rem 3rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.2rem; }
    .card { background: var(--card); border-radius: var(--radius); padding: 1.4rem; box-shadow: var(--shadow); transition: 0.3s; border: 2px solid transparent; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--border); }
    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.8rem; gap: 0.8rem; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 0.2rem; font-family: 'Montserrat', sans-serif; }
    .card-company { font-size: 0.9rem; color: var(--text-light); font-weight: 600; }
    .badge { background: linear-gradient(135deg, var(--secondary), var(--accent)); color: white; padding: 0.25rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
    .tag { background: #f0e6d2; color: var(--primary); padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; display: inline-block; margin-bottom: 0.6rem; }
    .phone-btn { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--bg); padding: 0.5rem 0.9rem; border-radius: 8px; color: var(--primary); text-decoration: none; font-weight: 600; margin: 0.5rem 0; transition: 0.3s; border: 2px solid var(--border); }
    .phone-btn:hover { background: var(--primary); color: white; }
    .card-desc { color: var(--text-light); font-size: 0.9rem; line-height: 1.5; margin: 0.5rem 0; }
    .card-price { background: #e8f5e9; color: var(--primary); padding: 0.4rem 0.7rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; display: inline-block; margin-top: 0.5rem; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding-top: 0.8rem; border-top: 1px dashed var(--border); font-size: 0.8rem; color: var(--text-light); }
    .site-link { color: var(--primary); text-decoration: none; font-weight: 600; }
    .review-btn { background: none; border: none; color: var(--secondary); cursor: pointer; font-size: 0.8rem; padding: 0; font-weight: 600; transition: 0.2s; }
    .review-btn:hover { text-decoration: underline; }
    .rating-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .stars { color: var(--star); letter-spacing: 2px; }
    .rating-count { color: var(--text-light); font-size: 0.8rem; }
    .empty { text-align: center; padding: 4rem 1rem; grid-column: 1/-1; }
    .empty span { font-size: 3.5rem; display: block; margin-bottom: 0.5rem; opacity: 0.6; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 100; backdrop-filter: blur(3px); }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); padding: 1.8rem; border-radius: var(--radius); width: 100%; max-width: 460px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.8rem; cursor: pointer; color: var(--text-light); transition: 0.2s; }
    .close-btn:hover { color: var(--text); }
    .modal h2 { margin-bottom: 1.2rem; font-size: 1.4rem; color: var(--primary); }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; color: var(--text); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 2px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; transition: 0.2s; font-family: inherit; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--secondary); }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .btn-row { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1rem; }
    .btn { padding: 0.8rem 1.5rem; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s; font-family: 'Montserrat', sans-serif; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-sec { background: #f0e6d2; color: var(--text); }
    .btn-sec:hover { background: #e0d5c1; }
    .btn-add { position: fixed; bottom: 2rem; right: 2rem; background: var(--secondary); color: white; padding: 1rem 2rem; border-radius: 50px; box-shadow: var(--shadow-hover); font-weight: 700; cursor: pointer; z-index: 90; transition: 0.3s; border: none; display: flex; align-items: center; gap: 0.5rem; font-family: 'Montserrat', sans-serif; }
    .btn-add:hover { transform: scale(1.05); background: var(--accent); }
    .sync-status { position: fixed; bottom: 2rem; left: 2rem; background: white; padding: 0.6rem 1rem; border-radius: 8px; box-shadow: var(--shadow-hover); font-size: 0.85rem; font-weight: 600; z-index: 90; transition: 0.3s; opacity: 0; pointer-events: none; }
    .sync-status.show { opacity: 1; pointer-events: auto; }
    .sync-status.loading { color: var(--secondary); }
    .sync-status.success { color: var(--primary); }
    .sync-status.error { color: #ef4444; }
    footer { background: var(--primary); color: white; text-align: center; padding: 2rem 1rem; margin-top: 2rem; font-size: 0.9rem; }
    footer a { color: var(--accent); text-decoration: none; cursor: pointer; }
    .star-picker { display: flex; gap: 4px; font-size: 1.8rem; cursor: pointer; margin-top: 0.3rem; }
    .star-picker span { color: #d0d0d0; transition: color 0.15s, transform 0.15s; }
    .star-picker span.active { color: var(--star); }
    .star-picker span:hover { transform: scale(1.15); }
    @media (max-width: 768px) {
      .hero h1 { font-size: 1.9rem; }
      .grid { grid-template-columns: 1fr; }
      .search-box { flex-direction: column; padding: 1rem; }
      .search-box input, .search-box button { width: 100%; }
      .rubric-tabs, .subcat-pills { justify-content: flex-start; overflow-x: auto; padding-bottom: 0.5rem; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
      .tab-btn, .pill { flex-shrink: 0; }
      .btn-add { bottom: 1.5rem; right: 1.5rem; padding: 0.8rem 1.5rem; }
      .sync-status { left: 1rem; bottom: 1rem; }
    }

    <p>Каталог контактов, услуг и развлечений нашего посёлка</p>
  </header>
  <div class="search-wrap">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Поиск по названию, телефону, услуге или имени...">
      <button id="searchBtn">Найти</button>
    </div>
  </div>
  <div class="nav-container">
    <div class="stats" id="stats"></div>
    <div class="rubric-tabs" id="rubricTabs"></div>
    <div class="subcat-pills" id="subcatPills"></div>
  </div>
  <main class="container"><div class="grid" id="grid"></div></main>
  <button class="btn-add" id="openAddModal">+ Добавить контакт</button>
  <div id="syncStatus" class="sync-status">⏳ Отправка заявки...</div>
  <footer>
    <p>🏡 SmartVille — сообщество загородной жизни</p>
    <p style="opacity:0.8; margin-top:0.5rem;">Данные публикуются после проверки администратором</p>
  </footer>

  <!-- Modal: Добавить контакт -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <button class="close-btn" id="closeAddModal">&times;</button>
      <h2>Добавить новый контакт</h2>
      <form id="addForm">
        <div class="form-group"><label for="f_rubric">Рубрика <span style="color:var(--text-light); font-weight:400; font-size:0.8em;">(выберите или введите новую)</span></label><input type="text" id="f_rubric" list="rubricList" placeholder="Напр: Бытовые услуги, Медицина..." required><datalist id="rubricList"></datalist></div>
        <div class="form-group"><label for="f_cat">Категория <span style="color:var(--text-light); font-weight:400; font-size:0.8em;">(выберите или введите новую)</span></label><input type="text" id="f_cat" list="catList" placeholder="Напр: Сантехника, Ветклиника..." required><datalist id="catList"></datalist></div>
        <div class="form-group"><label for="f_name">Наименование услуги</label><input type="text" id="f_name" required placeholder="Напр: Обслуживание котлов"></div>
        <div class="form-group"><label for="f_company">Имя / Компания</label><input type="text" id="f_company" placeholder="Напр: Александр / МосОблГаз"></div>
        <div class="form-group"><label for="f_phone">Телефон</label><input type="tel" id="f_phone" required placeholder="+7 (999) 000-00-00"></div>
        <div class="form-group"><label for="f_desc">Комментарии / Описание</label><textarea id="f_desc" placeholder="Что делает, особенности, рекомендации..."></textarea></div>
        <div class="form-group"><label for="f_price">Примерные цены</label><input type="text" id="f_price" placeholder="Напр: 4500 ₽, от 1000 ₽/час"></div>
        <div class="form-group"><label for="f_web">Сайт / Instagram</label><input type="url" id="f_web" placeholder="https://..."></div>
        <div class="form-group"><label for="f_author">Кто добавил</label><input type="text" id="f_author" required placeholder="Ваше имя"></div>
        <div class="btn-row"><button type="button" class="btn btn-sec" id="cancelForm">Отмена</button><button type="submit" class="btn btn-primary">📤 Отправить на модерацию</button></div>
      </form>
    </div>
  </div>

  <!-- Modal: Отзыв -->
  <div class="modal-overlay" id="reviewModal">
    <div class="modal">
      <button class="close-btn" id="closeReviewModal">&times;</button>
      <h2>Оставить отзыв</h2>
      <form id="reviewForm">
        <input type="hidden" id="r_masterId">
        <div class="form-group"><label for="r_author">Ваше имя</label><input type="text" id="r_author" required placeholder="Иван П."></div>
        <div class="form-group"><label>Оценка</label><div class="star-picker" id="starPicker"><span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span></div></div>
        <input type="hidden" id="r_rating" value="5">
        <div class="form-group"><label for="r_text">Текст отзыва</label><textarea id="r_text" required placeholder="Что понравилось?"></textarea></div>
        <div class="btn-row"><button type="button" class="btn btn-sec" id="cancelReviewModal">Отмена</button><button type="submit" class="btn btn-primary">📤 Опубликовать</button></div>
      </form>
    </div>

      function showSync(status, msg) { els.syncStatus.className = `sync-status show ${status}`; els.syncStatus.textContent = msg; setTimeout(() => els.syncStatus.classList.remove('show'), 4000); }

      function formatPhone(val) { let d = val.replace(/\D/g, ''); if (d.startsWith('8')) d = '7' + d.slice(1); if (d.length === 10) d = '7' + d; if (d.length === 11 && d.startsWith('7')) return `+7(${d.slice(1,4)})${d.slice(4,7)}-${d.slice(7,9)}-${d.slice(9)}`; return val; }

      function getRubricIcon(r) { return {'Бытовые услуги':'🔧','Строительство':'🏗️','Еда и рестораны':'🍽️','Магазины и доставки':'🛒','Отдых и развлечения':'🎉','Мероприятия в посёлке':'🎪','Медицина и аптеки':'🏥','Животные и защита от насекомых':'🐾'}[r]||'📋'; }

      function setCategory(c) { activeCategory = c; renderCategories(); renderGrid(); }

      function calcRating(reviews) { if (!reviews?.length) return { avg: 0, count: 0 }; const s = reviews.reduce((a,r)=>a+r.rating,0); return { avg:(s/reviews.length).toFixed(1), count:reviews.length }; }

      function renderGrid() { els.grid.innerHTML = ''; const filtered = catalogData.filter(item => { const mR = activeRubric === 'Все' || item.rubric === activeRubric; const mC = activeCategory === 'Все' || item.category === activeCategory; const mS = !searchQuery || `${item.name} ${item.company} ${item.phone} ${item.desc}`.toLowerCase().includes(searchQuery); return mR && mC && mS; }); if (!filtered.length) { els.grid.innerHTML = `<div class="empty"><span>🔍</span><h3>Ничего не найдено</h3><p>Измените параметры поиска</p></div>`; return; } const frag = document.createDocumentFragment(); filtered.forEach(item => { const { avg, count } = calcRating(item.reviews); const stars = avg > 0 ? '★'.repeat(Math.round(avg)) + '☆'.repeat(5-Math.round(avg)) : '☆☆☆☆☆'; const card = document.createElement('div'); card.className = 'card'; let phonesHtml = ''; if(item.phone) item.phone.split(',').map(p=>p.trim()).forEach(p=>{ phonesHtml += `<a href="tel:${p.replace(/\D/g,'')}" class="phone-btn">📞 ${p}</a> `; }); const webHtml = item.web ? `<a href="${item.web}" target="_blank" class="site-link">🌐 Перейти</a>` : ''; card.innerHTML = `<div class="card-header"><div><div class="card-title">${item.name}</div><div class="card-company">${item.company||''}</div></div><span class="badge">${item.rubric}</span></div><div class="rating-row"><span class="stars">${stars}</span><span class="rating-count">${avg>0?avg:'—'} (${count})</span></div>${phonesHtml}<span class="tag">📌 ${item.category}</span>${item.desc?`<div class="card-desc">${item.desc}</div>`:''}${item.price?`<div class="card-price">💰 ${item.price}</div>`:''}${webHtml?`<div style="margin-top:0.5rem">${webHtml}</div>`:''}<div class="card-footer"><span>👤 ${item.author||'Житель'}</span><button class="review-btn" data-id="${item.id}">✍️ Оставить отзыв</button></div>`; frag.appendChild(card); }); els.grid.appendChild(frag); document.querySelectorAll('.review-btn').forEach(btn => btn.onclick = () => openReviewModal(parseInt(btn.dataset.id))); }

        item.reviews.unshift({ author:document.getElementById('r_author').value.trim(), rating:parseInt(els.ratingInput.value), text:document.getElementById('r_text').value.trim(), date:new Date().toLocaleDateString('ru-RU') });
        renderAll(); closeModal(els.reviewModal); els.reviewForm.reset(); showSync('success', '✅ Отзыв опубликован!');
      };

      els.searchBtn.onclick = () => { searchQuery=els.searchInput.value.toLowerCase(); renderGrid(); };
      els.searchInput.oninput = () => { searchQuery=els.searchInput.value.toLowerCase(); renderGrid(); };
      els.searchInput.onkeydown = e => { if(e.key==='Enter') { searchQuery=els.searchInput.value.toLowerCase(); renderGrid(); }};

      async function loadDataFromGitHub() {
        try { const res = await fetch('data.json', { cache: 'no-store' }); if(res.ok) { const d=await res.json(); if(Array.isArray(d)&&d.length>0) { catalogData=d; renderAll(); } } } catch(e){}
      }
      renderAll(); loadDataFromGitHub();
    });
  </script>
</body>
</html>

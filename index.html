<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartVille — Каталог услуг</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { 
      --primary: #2d5a3d; --primary-light: #4a7c59; --secondary: #d4a574; --accent: #e8b86d; 
      --bg: #f7f5ee; --card: #ffffff; --text: #2c3e2d; --text-light: #6b7b6e; 
      --border: #e0d5c1; --shadow: 0 4px 16px rgba(45,90,61,0.06); 
      --shadow-hover: 0 8px 24px rgba(45,90,61,0.12); --radius: 16px; --star: #f59e0b; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Open Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    h1,h2,h3,h4 { font-family: 'Montserrat', sans-serif; }
    
    .hero { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; padding: 3rem 1rem 3.5rem; text-align: center; position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; inset: 0; background: url("image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E"); }
    .hero h1 { font-size: 2.4rem; margin-bottom: 0.4rem; font-weight: 700; text-shadow: 1px 1px 3px rgba(0,0,0,0.15); }
    .hero p { font-size: 1.1rem; opacity: 0.9; }

    .search-wrap { max-width: 700px; margin: -1.8rem auto 1.5rem; padding: 0 1rem; position: relative; z-index: 2; }
    .search-box { background: white; border-radius: 50px; display: flex; align-items: center; box-shadow: var(--shadow-hover); border: 2px solid var(--border); padding: 0.4rem; transition: 0.3s; }
    .search-box:focus-within { border-color: var(--secondary); transform: translateY(-2px); }
    .search-box input { flex: 1; border: none; padding: 0.9rem 1.2rem; font-size: 1rem; outline: none; background: transparent; font-family: inherit; }
    .search-box button { background: var(--secondary); color: white; border: none; padding: 0.8rem 1.8rem; border-radius: 50px; cursor: pointer; font-weight: 600; transition: 0.3s; font-family: 'Montserrat', sans-serif; }
    .search-box button:hover { background: var(--accent); }

    .nav-container { max-width: 1100px; margin: 0 auto; padding: 0 1rem 1rem; }
    .rubric-tabs { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1rem; }
    .tab-btn { padding: 0.6rem 1.2rem; background: white; border: 2px solid var(--border); border-radius: 30px; cursor: pointer; font-weight: 600; transition: 0.3s; font-family: 'Montserrat', sans-serif; font-size: 0.85rem; white-space: nowrap; box-shadow: var(--shadow); }
    .tab-btn:hover, .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-2px); }
    
    .subcat-pills { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1.5rem; }
    .pill { padding: 0.4rem 0.9rem; background: rgba(255,255,255,0.7); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
    .pill:hover, .pill.active { background: var(--secondary); color: white; border-color: var(--secondary); }

    .stats { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .stat { background: white; padding: 0.8rem 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; }
    .stat-num { font-size: 1.5rem; font-weight: 700; color: var(--primary); font-family: 'Montserrat', sans-serif; }
    .stat-label { font-size: 0.8rem; color: var(--text-light); }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 1rem 3rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.2rem; }
    
    .card { background: var(--card); border-radius: var(--radius); padding: 1.4rem; box-shadow: var(--shadow); transition: 0.3s; border: 2px solid transparent; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--border); }
    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.8rem; gap: 0.8rem; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 0.2rem; font-family: 'Montserrat', sans-serif; }
    .card-company { font-size: 0.9rem; color: var(--text-light); font-weight: 600; }
    .badge { background: linear-gradient(135deg, var(--secondary), var(--accent)); color: white; padding: 0.25rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
    .tag { background: #f0e6d2; color: var(--primary); padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; display: inline-block; margin-bottom: 0.6rem; }
    .phone-btn { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--bg); padding: 0.5rem 0.9rem; border-radius: 8px; color: var(--primary); text-decoration: none; font-weight: 600; margin: 0.5rem 0; transition: 0.3s; border: 2px solid var(--border); }
    .phone-btn:hover { background: var(--primary); color: white; }
    .card-desc { color: var(--text-light); font-size: 0.9rem; line-height: 1.5; margin: 0.5rem 0; }
    .card-price { background: #e8f5e9; color: var(--primary); padding: 0.4rem 0.7rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; display: inline-block; margin-top: 0.5rem; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding-top: 0.8rem; border-top: 1px dashed var(--border); font-size: 0.8rem; color: var(--text-light); flex-wrap: wrap; gap: 0.5rem; }
    .site-link { color: var(--primary); text-decoration: none; font-weight: 600; }
    .review-btn { background: none; border: none; color: var(--secondary); cursor: pointer; font-size: 0.8rem; padding: 0; font-weight: 600; transition: 0.2s; }
    .review-btn:hover { text-decoration: underline; }
    .reviews-list-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 0.8rem; padding: 0; font-weight: 600; transition: 0.2s; }
    .reviews-list-btn:hover { text-decoration: underline; }
    
    .rating-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .stars { color: var(--star); letter-spacing: 2px; }
    .rating-count { color: var(--text-light); font-size: 0.8rem; }

    .empty { text-align: center; padding: 4rem 1rem; grid-column: 1/-1; }
    .empty span { font-size: 3.5rem; display: block; margin-bottom: 0.5rem; opacity: 0.6; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 100; backdrop-filter: blur(3px); }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); padding: 1.8rem; border-radius: var(--radius); width: 100%; max-width: 460px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.8rem; cursor: pointer; color: var(--text-light); transition: 0.2s; }
    .close-btn:hover { color: var(--text); }
    .modal h2 { margin-bottom: 1.2rem; font-size: 1.4rem; color: var(--primary); }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; color: var(--text); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 2px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; transition: 0.2s; font-family: inherit; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--secondary); }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .btn-row { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1rem; }
    .btn { padding: 0.8rem 1.5rem; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s; font-family: 'Montserrat', sans-serif; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-sec { background: #f0e6d2; color: var(--text); }
    .btn-sec:hover { background: #e0d5c1; }
    .btn-add { position: fixed; bottom: 2rem; right: 2rem; background: var(--secondary); color: white; padding: 1rem 2rem; border-radius: 50px; box-shadow: var(--shadow-hover); font-weight: 700; cursor: pointer; z-index: 90; transition: 0.3s; border: none; display: flex; align-items: center; gap: 0.5rem; font-family: 'Montserrat', sans-serif; }
    .btn-add:hover { transform: scale(1.05); background: var(--accent); }
    .sync-status { position: fixed; bottom: 2rem; left: 2rem; background: white; padding: 0.6rem 1rem; border-radius: 8px; box-shadow: var(--shadow-hover); font-size: 0.85rem; font-weight: 600; z-index: 90; transition: 0.3s; opacity: 0; pointer-events: none; }
    .sync-status.show { opacity: 1; pointer-events: auto; }
    .sync-status.loading { color: var(--secondary); }
    .sync-status.success { color: var(--primary); }
    .sync-status.error { color: #ef4444; }
    
    footer { background: var(--primary); color: white; text-align: center; padding: 2rem 1rem; margin-top: 2rem; font-size: 0.9rem; }
    footer a { color: var(--accent); text-decoration: none; cursor: pointer; }
    
    .star-picker { display: flex; gap: 4px; font-size: 1.8rem; cursor: pointer; margin-top: 0.3rem; }
    .star-picker span { color: #d0d0d0; transition: color 0.15s, transform 0.15s; }
    .star-picker span.active { color: var(--star); }
    .star-picker span:hover { transform: scale(1.15); }

    .review-item { padding: 0.8rem 0; border-bottom: 1px solid var(--border); }
    .review-item:last-child { border-bottom: none; }
    .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
    .review-author { font-weight: 600; font-size: 0.9rem; }
    .review-date { font-size: 0.75rem; color: var(--text-light); }
    .review-stars { color: var(--star); font-size: 0.85rem; margin-bottom: 0.3rem; }
    .review-text { font-size: 0.9rem; line-height: 1.4; color: var(--text); }
    .no-reviews { text-align: center; color: var(--text-light); padding: 2rem 0; font-style: italic; }

    @media (max-width: 768px) {
      .hero h1 { font-size: 1.9rem; }
      .grid { grid-template-columns: 1fr; }
      .search-box { flex-direction: column; padding: 1rem; }
      .search-box input, .search-box button { width: 100%; }
      .rubric-tabs, .subcat-pills { justify-content: flex-start; overflow-x: auto; padding-bottom: 0.5rem; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
      .tab-btn, .pill { flex-shrink: 0; }
      .btn-add { bottom: 1.5rem; right: 1.5rem; padding: 0.8rem 1.5rem; }
      .sync-status { left: 1rem; bottom: 1rem; }
    }
  </style>
</head>
<body>

  <header class="hero">
    <h1>🌿 SmartVille</h1>
    <p>Каталог контактов, услуг и развлечений нашего посёлка</p>
  </header>

  <div class="search-wrap">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Поиск по названию, телефону, услуге или имени...">
      <button id="searchBtn">Найти</button>
    </div>
  </div>

  <div class="nav-container">
    <div class="stats" id="stats"></div>
    <div class="rubric-tabs" id="rubricTabs"></div>
    <div class="subcat-pills" id="subcatPills"></div>
  </div>

  <main class="container"><div class="grid" id="grid"></div></main>

  <button class="btn-add" id="openAddModal">+ Добавить контакт</button>
  <div id="syncStatus" class="sync-status">⏳ Отправка заявки...</div>

  <footer>
    <p>🏡 SmartVille — сообщество загородной жизни</p>
    <p style="opacity:0.8; margin-top:0.5rem;">Данные публикуются после проверки администратором</p>
  </footer>

  <!-- Modal: Добавить контакт -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <button class="close-btn" id="closeAddModal">&times;</button>
      <h2>Добавить новый контакт</h2>
      <form id="addForm">
        <div class="form-group"><label for="f_rubric">Рубрика <span style="color:var(--text-light); font-weight:400; font-size:0.8em;">(выберите или введите новую)</span></label><input type="text" id="f_rubric" list="rubricList" placeholder="Напр: Бытовые услуги..." required><datalist id="rubricList"></datalist></div>
        <div class="form-group"><label for="f_cat">Категория <span style="color:var(--text-light); font-weight:400; font-size:0.8em;">(выберите или введите новую)</span></label><input type="text" id="f_cat" list="catList" placeholder="Напр: Сантехника..." required><datalist id="catList"></datalist></div>
        <div class="form-group"><label for="f_name">Наименование услуги</label><input type="text" id="f_name" required placeholder="Напр: Обслуживание котлов"></div>
        <div class="form-group"><label for="f_company">Имя / Компания</label><input type="text" id="f_company" placeholder="Напр: Александр"></div>
        <div class="form-group"><label for="f_phone">Телефон</label><input type="tel" id="f_phone" required placeholder="+7 (999) 000-00-00"></div>
        <div class="form-group"><label for="f_desc">Комментарии / Описание</label><textarea id="f_desc" placeholder="Что делает, особенности..."></textarea></div>
        <div class="form-group"><label for="f_price">Примерные цены</label><input type="text" id="f_price" placeholder="Напр: 4500 ₽"></div>
        <div class="form-group"><label for="f_web">Сайт / Instagram</label><input type="url" id="f_web" placeholder="https://..."></div>
        <div class="form-group"><label for="f_author">Кто добавил</label><input type="text" id="f_author" required placeholder="Ваше имя"></div>
        <div class="btn-row"><button type="button" class="btn btn-sec" id="cancelForm">Отмена</button><button type="submit" class="btn btn-primary">📤 Отправить на модерацию</button></div>
      </form>
    </div>
  </div>

  <!-- Modal: Отзыв -->
  <div class="modal-overlay" id="reviewModal">
    <div class="modal">
      <button class="close-btn" id="closeReviewModal">&times;</button>
      <h2>Оставить отзыв</h2>
      <form id="reviewForm">
        <input type="hidden" id="r_masterId">
        <div class="form-group"><label for="r_author">Ваше имя</label><input type="text" id="r_author" required placeholder="Иван П."></div>
        <div class="form-group"><label>Оценка</label><div class="star-picker" id="starPicker"><span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span></div></div>
        <input type="hidden" id="r_rating" value="5">
        <div class="form-group"><label for="r_text">Текст отзыва</label><textarea id="r_text" required placeholder="Что понравилось?"></textarea></div>
        <div class="btn-row"><button type="button" class="btn btn-sec" id="cancelReviewModal">Отмена</button><button type="submit" class="btn btn-primary">📤 Отправить на модерацию</button></div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // === TELEGRAM BOT CONFIG ===
      const TG_CONFIG = {
        token: '8456078051:AAHnalIHLE7m96-U6wV_Wb5tNHWihVkO58c', // ВСТАВЬТЕ СЮДА ТОКЕН
        chatId: '165557958', // ВСТАВЬТЕ СЮДА ID
        adminUrl: 'https://elbeybutov.github.io/smartville-masters/moderate.html'
      };

      const DEFAULT_RUBRICS = {
        "Бытовые услуги": ["Водоочистка", "Сантехника", "Септики", "Электрика", "Окна и двери", "Котлы и газ", "Бытовая техника", "Вентиляция", "Мусор", "Уборка"],
        "Строительство": ["Строительство домов", "Вывоз мусора", "Благоустройство", "Сыпучие материалы", "Колодцы", "Лестницы", "Плотницкие работы"],
        "Еда и рестораны": ["Рестораны и кафе", "Доставка пиццы", "Суши", "Фермерские продукты", "Конструкторы"],
        "Магазины и доставки": ["Рыба", "Оформление праздников"],
        "Отдых и развлечения": ["Базы отдыха", "Активный отдых", "Праздники"],
        "Мероприятия": ["Детские занятия", "Кондитерские", "Флористика"],
        "Медицина": ["Аптеки", "Врачи", "Экстренная помощь"],
        "Животные": ["Груминг", "Ветклиники", "Обработка от клещей"]
      };

      let catalogData = []; // Изначально пусто
      let RUBRICS_CONFIG = JSON.parse(localStorage.getItem('sv_rubrics_config')) || JSON.parse(JSON.stringify(DEFAULT_RUBRICS));
      let activeRubric = 'Все', activeCategory = 'Все', searchQuery = '';

      const els = {
        stats: document.getElementById('stats'), rubricTabs: document.getElementById('rubricTabs'), subcatPills: document.getElementById('subcatPills'),
        grid: document.getElementById('grid'), searchInput: document.getElementById('searchInput'), searchBtn: document.getElementById('searchBtn'),
        syncStatus: document.getElementById('syncStatus'), openAddModal: document.getElementById('openAddModal'),
        addModal: document.getElementById('addModal'), closeAddModal: document.getElementById('closeAddModal'), cancelForm: document.getElementById('cancelForm'),
        addForm: document.getElementById('addForm'), f_rubric: document.getElementById('f_rubric'), f_cat: document.getElementById('f_cat'),
        f_name: document.getElementById('f_name'), f_company: document.getElementById('f_company'), f_phone: document.getElementById('f_phone'),
        f_desc: document.getElementById('f_desc'), f_price: document.getElementById('f_price'), f_web: document.getElementById('f_web'),
        f_author: document.getElementById('f_author'), rubricList: document.getElementById('rubricList'), catList: document.getElementById('catList'),
        reviewModal: document.getElementById('reviewModal'), closeReviewModal: document.getElementById('closeReviewModal'), cancelReviewModal: document.getElementById('cancelReviewModal'),
        reviewForm: document.getElementById('reviewForm'), r_masterId: document.getElementById('r_masterId'), starPicker: document.getElementById('starPicker'), ratingInput: document.getElementById('r_rating')
      };

      function showSync(status, msg) { els.syncStatus.className = `sync-status show ${status}`; els.syncStatus.textContent = msg; setTimeout(() => els.syncStatus.classList.remove('show'), 4000); }

      function formatPhone(val) { let d = val.replace(/\D/g, ''); if (d.startsWith('8')) d = '7' + d.slice(1); if (d.length === 10) d = '7' + d; if (d.length === 11 && d.startsWith('7')) return `+7(${d.slice(1,4)})${d.slice(4,7)}-${d.slice(7,9)}-${d.slice(9)}`; return val; }
      els.f_phone.addEventListener('blur', e => { e.target.value = formatPhone(e.target.value); });

      function renderAll() { renderStats(); renderRubrics(); renderCategories(); renderGrid(); }
      
      function renderStats() { 
        els.stats.innerHTML = `<div class="stat"><div class="stat-num">${Object.keys(RUBRICS_CONFIG).length}</div><div class="stat-label">Рубрик</div></div>
        <div class="stat"><div class="stat-num">${catalogData.length}</div><div class="stat-label">Контактов</div></div>`; 
      }
      
      function renderRubrics() { 
        els.rubricTabs.innerHTML = ''; 
        const btnAll = document.createElement('button'); btnAll.className = `tab-btn ${activeRubric==='Все'?'active':''}`; btnAll.textContent = '🏠 Все'; btnAll.onclick = () => setRubric('Все'); els.rubricTabs.appendChild(btnAll); 
        Object.keys(RUBRICS_CONFIG).forEach(r => { const btn = document.createElement('button'); btn.className = `tab-btn ${activeRubric===r?'active':''}`; btn.textContent = `${getRubricIcon(r)} ${r}`; btn.onclick = () => setRubric(r); els.rubricTabs.appendChild(btn); }); 
      }
      
      function getRubricIcon(r) { return {'Бытовые услуги':'🔧','Строительство':'🏗️','Еда и рестораны':'🍽️','Магазины и доставки':'🛒','Отдых и развлечения':'🎉','Мероприятия':'🎪','Медицина':'🏥','Животные':'🐾'}[r]||'📋'; }
      function setRubric(r) { activeRubric = r; activeCategory = 'Все'; renderAll(); }
      function setCategory(c) { activeCategory = c; renderCategories(); renderGrid(); }
      
      function renderCategories() { 
        els.subcatPills.innerHTML = ''; 
        if (activeRubric === 'Все') { els.subcatPills.innerHTML = '<span style="color:var(--text-light); font-size:0.85rem;">Выберите рубрику для фильтрации</span>'; return; } 
        const cats = ['Все', ...RUBRICS_CONFIG[activeRubric]]; 
        cats.forEach(cat => { const pill = document.createElement('button'); pill.className = `pill ${activeCategory===cat?'active':''}`; pill.textContent = cat; pill.onclick = () => setCategory(cat); els.subcatPills.appendChild(pill); }); 
      }
      
      function calcRating(reviews) { if (!reviews?.length) return { avg: 0, count: 0 }; const s = reviews.reduce((a,r)=>a+r.rating,0); return { avg:(s/reviews.length).toFixed(1), count:reviews.length }; }

      function renderGrid() {
        els.grid.innerHTML = '';
        
        // Loading State
        if (catalogData.length === 0) {
          els.grid.innerHTML = `<div class="empty"><span>⏳</span><h3>Загрузка каталога...</h3><p>Пожалуйста, подождите.</p></div>`;
          return;
        }

        const filtered = catalogData.filter(item => {
          const mR = activeRubric === 'Все' || item.rubric === activeRubric;
          const mC = activeCategory === 'Все' || item.category === activeCategory;
          const mS = !searchQuery || `${item.name} ${item.company} ${item.phone} ${item.desc}`.toLowerCase().includes(searchQuery);
          return mR && mC && mS;
        });

        if (!filtered.length) { els.grid.innerHTML = `<div class="empty"><span>🔍</span><h3>Ничего не найдено</h3><p>Попробуйте изменить параметры</p></div>`; return; }
        
        const frag = document.createDocumentFragment();
        filtered.forEach(item => {
          const { avg, count } = calcRating(item.reviews);
          const stars = avg > 0 ? '★'.repeat(Math.round(avg)) + '☆'.repeat(5-Math.round(avg)) : '☆☆☆☆☆';
          const card = document.createElement('div'); card.className = 'card';
          let phonesHtml = '';
          if(item.phone) item.phone.split(',').map(p=>p.trim()).forEach(p=>{ phonesHtml += `<a href="tel:${p.replace(/\D/g,'')}" class="phone-btn">📞 ${p}</a> `; });
          const webHtml = item.web ? `<a href="${item.web}" target="_blank" class="site-link">🌐 Перейти</a>` : '';
          
          card.innerHTML = `
            <div class="card-header"><div><div class="card-title">${item.name}</div><div class="card-company">${item.company||''}</div></div><span class="badge">${item.rubric}</span></div>
            <div class="rating-row"><span class="stars">${stars}</span><span class="rating-count">${avg>0?avg:'—'} (${count})</span></div>
            ${phonesHtml}<span class="tag">📌 ${item.category}</span>
            ${item.desc?`<div class="card-desc">${item.desc}</div>`:''}${item.price?`<div class="card-price">💰 ${item.price}</div>`:''}${webHtml?`<div style="margin-top:0.5rem">${webHtml}</div>`:''}
            <div class="card-footer">
              <span>👤 ${item.author||'Житель'}</span>
              <div style="display:flex; gap:0.8rem;">
                <button class="reviews-list-btn" data-id="${item.id}">📖 Отзывы (${count})</button>
                <button class="review-btn" data-id="${item.id}">✍️ Оставить отзыв</button>
              </div>
            </div>`;
          frag.appendChild(card);
        });
        els.grid.appendChild(frag);
        document.querySelectorAll('.review-btn').forEach(btn => btn.onclick = () => openReviewModal(parseInt(btn.dataset.id)));
        document.querySelectorAll('.reviews-list-btn').forEach(btn => btn.onclick = () => openReviewsList(parseInt(btn.dataset.id)));
      }

      function openModal(m) { m.classList.add('open'); }
      function closeModal(m) { m.classList.remove('open'); }
      els.openAddModal.onclick = () => { updateFormLists(); openModal(els.addModal); };
      els.closeAddModal.onclick = () => closeModal(els.addModal);
      els.cancelForm.onclick = () => closeModal(els.addModal);
      els.addModal.addEventListener('click', e => { if(e.target===els.addModal) closeModal(els.addModal); });
      els.closeReviewModal.onclick = () => closeModal(els.reviewModal);
      els.cancelReviewModal.onclick = () => closeModal(els.reviewModal);
      els.reviewModal.addEventListener('click', e => { if(e.target===els.reviewModal) closeModal(els.reviewModal); });

      function updateFormLists() {
        els.rubricList.innerHTML = '';
        Object.keys(RUBRICS_CONFIG).forEach(r => { const o=document.createElement('option'); o.value=r; els.rubricList.appendChild(o); });
        els.catList.innerHTML = '';
        const sel = els.f_rubric.value.trim();
        const cats = sel && RUBRICS_CONFIG[sel] ? RUBRICS_CONFIG[sel] : [...new Set(Object.values(RUBRICS_CONFIG).flat())];
        cats.forEach(c => { const o=document.createElement('option'); o.value=c; els.catList.appendChild(o); });
      }
      els.f_rubric.oninput = updateFormLists;

      async function sendTelegramNotification(data, isReview) {
        const typeText = isReview ? '📝 Новый отзыв' : '📞 Новая заявка (Контакт)';
        const name = isReview ? `Отзыв на #${data.masterId}` : data.name;
        const details = isReview ? `⭐ Рейтинг: ${data.review.rating}/5\n💬 Текст: ${data.review.text}` : `🏢 Компания: ${data.company || '-'}\n📞 Телефон: ${data.phone}\n📂 Рубрика: ${data.rubric}\n📌 Категория: ${data.category}\n📝 Описание: ${data.desc}`;
        const jsonData = JSON.stringify(data, null, 2);
        const base64Data = btoa(unescape(encodeURIComponent(jsonData)));
        const approveUrl = `${TG_CONFIG.adminUrl}?data=${encodeURIComponent(base64Data)}`;
        const text = `<b>${typeText} в SmartVille</b>\n\n👤 <b>Отправитель:</b> ${isReview ? data.review.author : data.author}\n🏷 <b>Объект:</b> ${name}\n\n${details}\n\n<b>👇 Нажмите кнопку ниже, чтобы добавить:</b>`;

        const apiUrl = `https://api.telegram.org/bot${TG_CONFIG.token}/sendMessage`;
	console.log('Попытка отправить запрос на:', apiUrl);

        try {
          const res = await fetch(`https://api.telegram.org/bot${TG_CONFIG.token}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: TG_CONFIG.chatId, text, parse_mode: 'HTML', reply_markup: { inline_keyboard: [[ { text: '✅ Добавить', url: approveUrl } ]] } }) });
          return res.ok;
        } catch (e) { return false; }
      }

        els.addForm.onsubmit = async e => {
        e.preventDefault();
        
        // 1. Проверка токенов перед отправкой
        if (TG_CONFIG.token === '8456078051:AAHnalIHLE7m96-U6wV_Wb5tNHWihVkO58c' || TG_CONFIG.chatId === '165557958') {
          alert('⚠️ Ошибка настройки:\nВставьте реальные TOKEN и CHAT_ID в начало скрипта (строка ~290).');
          console.error('❌ TG_CONFIG не настроен. Заполните token и chatId.');
          return;
        }

        // 2. Сбор данных
        const newItem = { 
          id: Date.now(), 
          rubric: els.f_rubric.value.trim(), 
          category: els.f_cat.value.trim(), 
          name: els.f_name.value.trim(), 
          company: els.f_company.value.trim(), 
          phone: formatPhone(els.f_phone.value.trim()), 
          desc: els.f_desc.value.trim(), 
          price: els.f_price.value.trim(), 
          web: els.f_web.value.trim(), 
          author: els.f_author.value.trim(), 
          reviews: [] 
        };

        console.log('📤 Отправка данных в Telegram:', newItem);
        showSync('loading', '⏳ Отправка заявки...');

        try {
          const sent = await sendTelegramNotification(newItem, false);
          if (sent) {
            showSync('success', '✅ Заявка успешно отправлена администратору!');
            setTimeout(() => closeModal(els.addModal), 1500);
            els.addForm.reset();
          } else {
            showSync('error', '❌ Не удалось отправить. Проверьте консоль (F12).');
            console.error('❌ Telegram API вернул ошибку. Проверьте токен или интернет.');
          }
        } catch (err) {
          console.error('🚨 Критическая ошибка отправки:', err);
          showSync('error', '❌ Ошибка сети или скрипта.');
        }
      };

      function updateStarsUI(val) { els.starPicker.querySelectorAll('span').forEach(st => st.classList.toggle('active', parseInt(st.dataset.v) <= val)); }
      els.starPicker.querySelectorAll('span').forEach(star => {
        star.addEventListener('mouseenter', () => updateStarsUI(parseInt(star.dataset.v)));
        star.addEventListener('mouseleave', () => updateStarsUI(parseInt(els.ratingInput.value) || 0));
        star.addEventListener('click', () => { els.ratingInput.value = parseInt(star.dataset.v); updateStarsUI(parseInt(els.ratingInput.value)); });
      });
      function openReviewModal(id) { document.getElementById('r_masterId').value = id; els.ratingInput.value = 5; updateStarsUI(5); openModal(els.reviewModal); }

      els.reviewForm.onsubmit = async e => {
        e.preventDefault();
        const id = parseInt(document.getElementById('r_masterId').value);
        const item = catalogData.find(i => i.id === id);
        if (!item) return;
        const newReview = { author: document.getElementById('r_author').value.trim(), rating: parseInt(els.ratingInput.value), text: document.getElementById('r_text').value.trim(), date: new Date().toLocaleDateString('ru-RU') };
        item.reviews = item.reviews || [];
        item.reviews.unshift(newReview);
        renderAll(); closeModal(els.reviewModal); els.reviewForm.reset();
        const reviewData = { type: 'review', masterId: id, review: newReview, author: newReview.author };
        showSync('loading', '⏳ Отправка отзыва...');
        const sent = await sendTelegramNotification(reviewData, true);
        if (sent) showSync('success', '✅ Отзыв отправлен!'); else showSync('error', '❌ Ошибка отправки.');
      };

      function openReviewsList(id) {
        const item = catalogData.find(i => i.id === id);
        if (!item || !item.reviews?.length) { alert('📭 Отзывов пока нет. Будьте первым!'); return; }
        let html = `<h3 style="margin-bottom:1rem; color:var(--primary);">Отзывы о "${item.name}"</h3>`;
        item.reviews.forEach(r => { const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating); html += `<div class="review-item"><div class="review-header"><span class="review-author">👤 ${r.author}</span><span class="review-date">📅 ${r.date}</span></div><div class="review-stars">${stars}</div><div class="review-text">${r.text}</div></div>`; });
        const tempModal = document.createElement('div'); tempModal.className = 'modal-overlay open';
        tempModal.innerHTML = `<div class="modal" style="max-width:500px;"><button class="close-btn" onclick="this.closest('.modal-overlay').remove()">&times;</button>${html}</div>`;
        document.body.appendChild(tempModal); tempModal.addEventListener('click', e => { if(e.target === tempModal) tempModal.remove(); });
      }

      els.searchBtn.onclick = () => { searchQuery=els.searchInput.value.toLowerCase(); renderGrid(); };
      els.searchInput.oninput = () => { searchQuery=els.searchInput.value.toLowerCase(); renderGrid(); };
      els.searchInput.onkeydown = e => { if(e.key==='Enter') { searchQuery=els.searchInput.value.toLowerCase(); renderGrid(); }};

      // === MAIN DATA LOADER ===
      async function loadData() {
        try {
          const res = await fetch('data.json', { cache: 'no-store' });
          if (res.ok) {
            const remoteData = await res.json();
            if (Array.isArray(remoteData) && remoteData.length > 0) {
              catalogData = remoteData;
              // Авто-обновление рубрик из данных
              const uniqueRubrics = [...new Set(catalogData.map(item => item.rubric))];
              let configUpdated = false;
              uniqueRubrics.forEach(rubric => {
                if (!RUBRICS_CONFIG[rubric]) {
                  const cats = [...new Set(catalogData.filter(i => i.rubric === rubric).map(i => i.category))];
                  RUBRICS_CONFIG[rubric] = cats;
                  configUpdated = true;
                }
              });
              if (configUpdated) localStorage.setItem('sv_rubrics_config', JSON.stringify(RUBRICS_CONFIG));
            }
          }
        } catch (e) { console.error('Ошибка загрузки data.json:', e); }
        renderAll();
      }

      loadData();
    });
  </script>
</body>
</html>

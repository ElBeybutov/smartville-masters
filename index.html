<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2d5a3d;
      --primary-light: #4a7c59;
      --secondary: #d4a574;
      --accent: #e8b86d;
      --bg: #f5f1e8;
      --card: #ffffff;
      --text: #2c3e2d;
      --text-light: #6b7b6e;
      --border: #e0d5c1;
      --shadow: 0 4px 20px rgba(45, 90, 61, 0.08);
      --shadow-hover: 0 8px 30px rgba(45, 90, 61, 0.15);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Open Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      background-image: 
        radial-gradient(#d4a574 0.5px, transparent 0.5px),
        radial-gradient(#d4a574 0.5px, var(--bg) 0.5px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }

    h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; }

    /* Header */
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      padding: 3rem 1rem 4rem;
      position: relative;
      overflow: hidden;
    }
    
    .hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity: 0.3;
    }

    .hero-content {
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    .hero p {
      font-size: 1.2rem;
      opacity: 0.95;
      margin-bottom: 2rem;
    }

    /* Search */
    .search-container {
      max-width: 700px;
      margin: -2rem auto 2rem;
      padding: 0 1rem;
      position: relative;
      z-index: 10;
    }

    .search-box {
      background: white;
      border-radius: 50px;
      padding: 0.5rem;
      box-shadow: var(--shadow-hover);
      display: flex;
      align-items: center;
      border: 2px solid var(--border);
      transition: all 0.3s;
    }

    .search-box:focus-within {
      border-color: var(--secondary);
      transform: translateY(-2px);
    }

    .search-box input {
      flex: 1;
      border: none;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      outline: none;
      background: transparent;
      font-family: inherit;
    }

    .search-box button {
      background: var(--secondary);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
    }

    .search-box button:hover {
      background: var(--accent);
      transform: scale(1.05);
    }

    /* Navigation */
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem 2rem;
    }

    .category-nav {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .nav-btn {
      padding: 0.7rem 1.5rem;
      border: 2px solid var(--border);
      background: white;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: var(--shadow);
    }

    .nav-btn:hover, .nav-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: white;
      padding: 1rem 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
      min-width: 150px;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      font-family: 'Montserrat', sans-serif;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-light);
    }

    /* Main Content */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }

    .section-title {
      font-size: 1.8rem;
      margin: 2rem 0 1.5rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding-bottom: 0.5rem;
      border-bottom: 3px solid var(--secondary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    /* Cards */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      transition: all 0.3s;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 1rem;
      gap: 1rem;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.3rem;
      font-family: 'Montserrat', sans-serif;
    }

    .card-company {
      font-size: 0.9rem;
      color: var(--text-light);
      font-weight: 600;
    }

    .category-badge {
      background: linear-gradient(135deg, var(--secondary), var(--accent));
      color: white;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      font-family: 'Montserrat', sans-serif;
    }

    .card-phone {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      margin: 0.8rem 0;
      transition: all 0.3s;
      border: 2px solid var(--border);
    }

    .card-phone:hover {
      background: var(--primary);
      color: white;
      transform: scale(1.02);
    }

    .card-desc {
      color: var(--text-light);
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0.8rem 0;
    }

    .card-price {
      background: #f0e6d2;
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
      margin-top: 0.8rem;
      display: inline-block;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px dashed var(--border);
      font-size: 0.8rem;
      color: var(--text-light);
    }

    .card-author {
      font-style: italic;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      grid-column: 1 / -1;
    }

    .empty-state span {
      font-size: 4rem;
      display: block;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-state h3 {
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    /* Footer */
    footer {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 2rem;
      margin-top: 3rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero h1 { font-size: 2rem; }
      .grid { grid-template-columns: 1fr; }
      .search-box { flex-direction: column; padding: 1rem; }
      .search-box input { width: 100%; }
      .search-box button { width: 100%; margin-top: 0.5rem; }
      .category-nav { gap: 0.5rem; }
      .nav-btn { padding: 0.6rem 1rem; font-size: 0.85rem; }
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card { animation: fadeIn 0.5s ease-out; }
  </style>
</head>

    function renderStats() {

        <div class="stat-card">

        </div>
        <div class="stat-card">
          <div class="stat-number">${withPhones}</div>
          <div class="stat-label">С телефонами</div>
        </div>
      `;

  const categories = ['Все', ...new Set(catalogData.map(item => item.category))];
  const icons = {
    'Все': '🏠',
    'Бытовые услуги': '🔧',
    'Строительство': '🏗️',

      `).join('');

    function setCategory(cat) {
      currentCategory = cat;
      renderCategoryNav();
      renderContent();
    }

    function filterData() {
      searchQuery = document.getElementById('searchInput').value.toLowerCase();
      renderContent();
    }

    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') filterData();
    });

    function renderContent() {
      const filtered = catalogData.filter(item => {
        const matchesCategory = currentCategory === 'Все' || item.category === currentCategory;
        const matchesSearch = !searchQuery || 
          item.name.toLowerCase().includes(searchQuery) ||
          (item.company && item.company.toLowerCase().includes(searchQuery)) ||
          (item.phone && item.phone.includes(searchQuery)) ||
          (item.desc && item.desc.toLowerCase().includes(searchQuery));
        return matchesCategory && matchesSearch;
      });

      const content = document.getElementById('content');
      
      if (filtered.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <span>🔍</span>
            <h3>Ничего не найдено</h3>
            <p>Попробуйте изменить параметры поиска или категорию</p>
          </div>
        `;
        return;
      }

      const grouped = filtered.reduce((acc, item) => {
        if (!acc[item.category]) acc[item.category] = [];
        acc[item.category].push(item);
        return acc;
      }, {});

      let html = '';
      for (const [category, items] of Object.entries(grouped)) {
        html += `<h2 class="section-title">${getCategoryIcon(category)} ${category}</h2>`;
        html += `<div class="grid">`;
        html += items.map(item => createCard(item)).join('');
        html += `</div>`;
      }
      
      content.innerHTML = html;
    }

function getCategoryIcon(category) {
  const icons = {
    'Бытовые услуги': '🔧',
    'Строительство': '🏗️',
    'Еда и рестораны': '🍽️',
    'Магазины и доставки': '🛒',
    'Отдых и развлечения': '🎉',
    'Мероприятия в посёлке': '🎪',
    'Медицина и аптеки': '🏥',
    'Животные и защита от насекомых': '🐾'
  };
  return icons[category] || '📋';
}

    function createCard(item) {
      const phoneLinks = item.phone ? item.phone.split(',').map(p => p.trim()).map(p => {
        const cleanPhone = p.replace(/\D/g, '');
        return `<a href="tel:${cleanPhone}" class="card-phone">📞 ${p}</a>`;
      }).join(' ') : '';

      const websiteLink = item.website ? `<a href="${item.website}" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 600;">🌐 Сайт</a>` : '';

      return `
        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title">${item.name}</div>
              ${item.company ? `<div class="card-company">${item.company}</div>` : ''}
            </div>
            <span class="category-badge">${item.category}</span>
          </div>
          ${phoneLinks}
          ${item.desc ? `<div class="card-desc">${item.desc}</div>` : ''}
          ${item.price ? `<div class="card-price">💰 ${item.price}</div>` : ''}
          ${websiteLink ? `<div style="margin-top: 0.5rem;">${websiteLink}</div>` : ''}
          <div class="card-meta">
            ${item.author ? `<span class="card-author"> Добавил: ${item.author}</span>` : '<span></span>'}
          </div>
        </div>
      `;
    }

    function exportData() {
      const dataStr = "text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(catalogData, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `smartville_catalog_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    // Start
    init();
  </script>

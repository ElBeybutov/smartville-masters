<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мастера SmartVille</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b;
      --primary: #2563eb; --primary-hover: #1d4ed8; --accent: #10b981;
      --border: #e2e8f0; --radius: 12px; --shadow: 0 4px 12px rgba(0,0,0,0.06);
      --star: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding: 1rem; }
    
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 2rem; margin-bottom: 0.2rem; background: linear-gradient(135deg, #2563eb, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: var(--muted); font-size: 0.95rem; }

    .controls { display: flex; flex-direction: column; gap: 0.8rem; max-width: 900px; margin: 0 auto 1.5rem; }
    .search-box { position: relative; }
    .search-box input { width: 100%; padding: 0.9rem 1rem 0.9rem 2.8rem; border: 2px solid var(--border); border-radius: var(--radius); font-size: 1rem; outline: none; transition: border 0.2s; }
    .search-box input:focus { border-color: var(--primary); }
    .search-box::before { content: "🔍"; position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); opacity: 0.5; }

    .categories { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
    .cat-btn { padding: 0.5rem 1rem; border: 1px solid var(--border); background: var(--card); border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .cat-btn:hover, .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .actions { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 0.5rem; }
    .btn { padding: 0.7rem 1.2rem; border: none; border-radius: var(--radius); font-size: 0.9rem; cursor: pointer; font-weight: 500; transition: 0.2s; display: inline-flex; align-items: center; gap: 0.4rem; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-success { background: var(--accent); color: white; }
    .btn-success:hover { background: #059669; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.2rem; max-width: 950px; margin: 0 auto; }
    .card { background: var(--card); padding: 1.3rem; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); position: relative; transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
    
    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem; gap: 0.5rem; }
    .card h3 { font-size: 1.15rem; margin-bottom: 0.2rem; }
    .tag { font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 12px; background: #dbeafe; color: #1e40af; font-weight: 600; white-space: nowrap; }
    
    .rating-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.3rem 0 0.5rem; }
    .stars { color: var(--star); letter-spacing: 1px; }
    .rating-count { color: var(--muted); font-size: 0.8rem; }
    
    .phone { color: var(--primary); text-decoration: none; font-weight: 600; display: block; margin: 0.3rem 0 0.6rem; font-size: 1.05rem; }
    .phone:hover { text-decoration: underline; }
    .desc { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.8rem; line-height: 1.4; }
    
    .meta { font-size: 0.75rem; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px dashed var(--border); }
    .review-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 0.8rem; padding: 0; font-weight: 500; }
    .review-btn:hover { text-decoration: underline; }
    
    .delete-btn { position: absolute; top: 0.8rem; right: 0.8rem; background: none; border: none; cursor: pointer; font-size: 1.1rem; opacity: 0.3; transition: opacity 0.2s; }
    .delete-btn:hover { opacity: 1; color: #ef4444; }

    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); grid-column: 1 / -1; }
    .empty span { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 100; backdrop-filter: blur(2px); }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); padding: 1.5rem; border-radius: var(--radius); width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: relative; max-height: 90vh; overflow-y: auto; }
    .modal h2 { margin-bottom: 1rem; font-size: 1.3rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 500; font-size: 0.9rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.7rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; resize: vertical; font-family: inherit; }
    .form-group textarea { min-height: 80px; }
    .modal-actions { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 0.5rem; }
    .close-modal { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; opacity: 0.5; }
    
    .star-picker { display: flex; gap: 5px; font-size: 1.5rem; cursor: pointer; margin-top: 0.3rem; }
    .star-picker span { opacity: 0.3; transition: 0.2s; }
    .star-picker span.active, .star-picker span:hover, .star-picker span:hover ~ span { opacity: 1; color: var(--star); }
    .star-picker { flex-direction: row-reverse; justify-content: flex-end; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.6rem; }
      .grid { grid-template-columns: 1fr; }
      .cat-btn { padding: 0.4rem 0.7rem; font-size: 0.8rem; }
      .card { padding: 1.1rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🛠 Мастера посёлка SmartVille</h1>
    <p>Надёжные специалисты. Добавляйте, оценивайте, находите за секунды.</p>
  </header>

  <main>
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по имени, услуге или телефону...">
      </div>
      <div class="categories" id="catFilters"></div>
      <div class="actions">
        <button class="btn btn-primary" id="openMasterModal">+ Добавить мастера</button>
        <button class="btn btn-secondary" id="fetchGitHub">🔄 Загрузить с GitHub</button>
        <button class="btn btn-secondary" id="exportData">💾 Экспорт для GitHub</button>
        <input type="file" id="importFile" accept=".json" hidden>
        <button class="btn btn-secondary" id="importData">📥 Импорт JSON</button>
      </div>
    </div>

    <div class="grid" id="mastersList"></div>
  </main>

  <!-- Modal: Добавить мастера -->
  <div class="modal-overlay" id="masterModal">
    <div class="modal">
      <button class="close-modal" id="closeMasterModal">&times;</button>
      <h2>Добавить специалиста</h2>
      <form id="addMasterForm">
        <div class="form-group"><label for="m_name">Имя / Название</label><input type="text" id="m_name" required placeholder="Иван Петров / Теплосервис"></div>
        <div class="form-group"><label for="m_phone">Телефон</label><input type="tel" id="m_phone" required placeholder="+7 (999) 123-45-67"></div>
        <div class="form-group">
          <label for="m_cat">Категория</label>
          <select id="m_cat" required>
            <option value="Отопление">🔥 Отопление</option><option value="Электричество">💡 Электричество</option>
            <option value="Газ">🔥 Газ</option><option value="Сантехника">🚿 Сантехника</option>
            <option value="Кровля/Фасад">🏠 Кровля/Фасад</option><option value="Заборы/Ограждения">🚧 Заборы</option>
            <option value="Другое">📦 Другое</option>
          </select>
        </div>
        <div class="form-group"><label for="m_desc">Услуги / Описание</label><textarea id="m_desc" placeholder="Напр: Установка котлов, выезд в день обращения..."></textarea></div>
        <div class="form-group"><label for="m_by">Кто добавил (имя жителя)</label><input type="text" id="m_by" required placeholder="Ваше имя"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelMasterModal">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Оставить отзыв -->
  <div class="modal-overlay" id="reviewModal">
    <div class="modal">
      <button class="close-modal" id="closeReviewModal">&times;</button>
      <h2>Отзыв о мастере</h2>
      <form id="addReviewForm">
        <input type="hidden" id="r_masterId">
        <div class="form-group"><label for="r_author">Ваше имя</label><input type="text" id="r_author" required placeholder="Алексей К."></div>
        <div class="form-group"><label>Оценка</label><div class="star-picker" id="starPicker"><span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span></div></div>
        <input type="hidden" id="r_rating" value="5">
        <div class="form-group"><label for="r_text">Отзыв</label><textarea id="r_text" placeholder="Что понравилось? Рекомендации?" required></textarea></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelReviewModal">Отмена</button>
          <button type="submit" class="btn btn-success">Опубликовать отзыв</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'smartville_masters_v2';
    const DATA_URL = 'data.json'; // Для GitHub Pages
    let masters = [];
    let activeCategory = 'Все';

    // --- Загрузка данных ---
    async function loadData() {
      try {
        // Пытаемся загрузить с GitHub Pages / локального сервера
        const res = await fetch(DATA_URL, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            masters = data;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(masters));
            renderAll();
            return;
          }
        }
      } catch (e) { console.log('Offline/Local mode'); }
      
      // Фоллбэк на localStorage
      const stored = localStorage.getItem(STORAGE_KEY);
      masters = stored ? JSON.parse(stored) : [];
      if (masters.length === 0) initDemo();
      renderAll();
    }

    function initDemo() {
      masters = [
        { id: 1715432100001, name: 'Алексей С.', phone: '+79991234567', category: 'Электричество', desc: 'Замена проводки, щитков, умный дом. Выезд в день обращения.', addedBy: 'Админ', date: '01.05.2026', reviews: [{author:'Ольга', rating:5, text:'Всё сделал быстро и аккуратно!', date:'03.05.2026'}] },
        { id: 1715432100002, name: 'ГазСервис SmartVille', phone: '+79997654321', category: 'Газ', desc: 'Подключение, опломбировка, ремонт плит и котлов. Лицензия.', addedBy: 'Мария И.', date: '02.05.2026', reviews: [] }
      ];
      saveData();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(masters));
      renderAll();
    }

    // --- Рендер ---
    function renderAll() {
      renderCategories();
      renderMasters();
    }

    function renderCategories() {
      const cats = ['Все', ...new Set(masters.map(m => m.category))];
      const container = document.getElementById('catFilters');
      container.innerHTML = '';
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${cat === activeCategory ? 'active' : ''}`;
        btn.textContent = cat;
        btn.onclick = () => { activeCategory = cat; renderAll(); };
        container.appendChild(btn);
      });
    }

    function calcRating(reviews) {
      if (!reviews || reviews.length === 0) return { avg: 0, count: 0 };
      const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
      return { avg: (sum / reviews.length).toFixed(1), count: reviews.length };
    }

    function renderMasters() {
      const list = document.getElementById('mastersList');
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = masters.filter(m => {
        const matchesSearch = m.name.toLowerCase().includes(query) || m.desc.toLowerCase().includes(query) || m.category.toLowerCase().includes(query) || m.phone.includes(query);
        return matchesSearch && (activeCategory === 'Все' || m.category === activeCategory);
      });

      list.innerHTML = '';
      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty"><span>🔍</span>Мастера не найдены.<br>Добавьте первый контакт или проверьте фильтры.</div>`;
        return;
      }

      filtered.forEach(m => {
        const { avg, count } = calcRating(m.reviews);
        const stars = avg > 0 ? '★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg)) : '☆☆☆☆☆';
        
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <button class="delete-btn" title="Удалить" onclick="deleteMaster(${m.id})">🗑</button>
          <div class="card-header"><h3>${escapeHtml(m.name)}</h3><span class="tag">${m.category}</span></div>
          <div class="rating-row"><span class="stars">${stars}</span><span class="rating-count">${avg > 0 ? avg : '—'} (${count})</span></div>
          <a href="tel:${m.phone}" class="phone">📞 ${m.phone}</a>
          <p class="desc">${escapeHtml(m.desc) || 'Без описания'}</p>
          <div class="meta">
            <span>Добавил: ${escapeHtml(m.addedBy)} • ${m.date}</span>
            <button class="review-btn" onclick="openReviewModal(${m.id})">📝 Оставить отзыв</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    // --- Модальные окна & Формы ---
    function toggleModal(id, show) { document.getElementById(id).classList.toggle('open', show); }
    document.getElementById('openMasterModal').onclick = () => toggleModal('masterModal', true);
    document.getElementById('closeMasterModal').onclick = document.getElementById('cancelMasterModal').onclick = () => toggleModal('masterModal', false);
    document.getElementById('closeReviewModal').onclick = document.getElementById('cancelReviewModal').onclick = () => toggleModal('reviewModal', false);
    document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if(e.target === m) m.classList.remove('open'); }));
    document.addEventListener('keydown', e => { if(e.key === 'Escape') document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open')); });

    // Добавление мастера
    document.getElementById('addMasterForm').onsubmit = e => {
      e.preventDefault();
      const newM = { id: Date.now(), name: document.getElementById('m_name').value.trim(), phone: document.getElementById('m_phone').value.trim(), category: document.getElementById('m_cat').value, desc: document.getElementById('m_desc').value.trim(), addedBy: document.getElementById('m_by').value.trim(), date: new Date().toLocaleDateString('ru-RU'), reviews: [] };
      masters.unshift(newM); saveData(); toggleModal('masterModal', false); e.target.reset();
    };

    // Звёзды в отзыве
    const starPicker = document.getElementById('starPicker');
    starPicker.querySelectorAll('span').forEach(s => {
      s.onclick = () => {
        const val = parseInt(s.dataset.v);
        document.getElementById('r_rating').value = val;
        starPicker.querySelectorAll('span').forEach(st => st.classList.toggle('active', parseInt(st.dataset.v) <= val));
      };
    });

    // Добавление отзыва
    function openReviewModal(id) {
      document.getElementById('r_masterId').value = id;
      starPicker.querySelectorAll('span').forEach(s => s.classList.toggle('active', true));
      document.getElementById('r_rating').value = 5;
      toggleModal('reviewModal', true);
    }
    document.getElementById('addReviewForm').onsubmit = e => {
      e.preventDefault();
      const id = parseInt(document.getElementById('r_masterId').value);
      const master = masters.find(m => m.id === id);
      if (!master) return;
      const review = { author: document.getElementById('r_author').value.trim(), rating: parseInt(document.getElementById('r_rating').value), text: document.getElementById('r_text').value.trim(), date: new Date().toLocaleDateString('ru-RU') };
      master.reviews = master.reviews || [];
      master.reviews.unshift(review);
      saveData(); toggleModal('reviewModal', false); e.target.reset();
      alert('✅ Спасибо за отзыв!');
    };

    function deleteMaster(id) {
      if (confirm('Удалить этот контакт и все отзывы?')) {
        masters = masters.filter(m => m.id !== id); saveData();
      }
    }

    document.getElementById('searchInput').addEventListener('input', renderMasters);

    // Экспорт/Импорт
    document.getElementById('exportData').onclick = () => {
      const blob = new Blob([JSON.stringify(masters, null, 2)], {type: 'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `data.json`; a.click();
    };
    document.getElementById('importData').onclick = () => document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = e => {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          if(Array.isArray(data)) { masters = data; saveData(); alert('✅ База обновлена!'); }
        } catch { alert('❌ Ошибка формата'); }
      }; reader.readAsText(file); e.target.value = '';
    };
    document.getElementById('fetchGitHub').onclick = loadData;

    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    // Инициализация
    loadData();
  </script>
</body>
</html>
